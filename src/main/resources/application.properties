# ===================================================================
# AstraLab MySQL & JPA Configuration
# ===================================================================
spring.application.name=astralab-schema
server.port=8081

# MySQL DataSource Settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astralab}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Prajwal@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# SQL Initialization Settings
spring.sql.init.mode=never

# Persistent File Storage Directory
app.storage.upload-dir=${APP_STORAGE_DIR:./data/uploads}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Automatic Dummy Data Seeding for Testing & Insomnia
app.dummy-data.enabled=${APP_DUMMY_DATA_ENABLED:true}

